<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gloamdeep</title>
<!-- Installing on a home screen (D-375): the app card and icon are added by src/render/appicon.js. -->
<meta name="theme-color" content="#0b0a10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gloamdeep">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  html, body { margin: 0; height: 100%; background: #0b0a10; color: #9790a4; color-scheme: dark; }
  body {
    -webkit-tap-highlight-color: transparent; /* D-011 */
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation; overflow: hidden;
  }
  main {
    position: fixed; inset: 0; display: grid; place-items: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* The box the canvas is fitted into (src/render/screen.js). */
  #stage { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; touch-action: none; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #0e0c16; }
  /* The room fills the stage behind; the menus' picture stands over it, see-through in play (D-381). */
  #room { position: absolute; }
  #game { position: relative; background: none; }
  :focus-visible { outline: 2px solid #ffc65c; outline-offset: 2px; }
  /* The text line's words for screen readers (src/main.js); it is drawn on the canvas. */
  #line { position: fixed; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #version {
    position: fixed; left: max(8px, env(safe-area-inset-left)); bottom: max(6px, env(safe-area-inset-bottom)); /* clear of the lantern (D-381) */
    font: 11px/1 ui-monospace, "Courier New", monospace; opacity: .7; pointer-events: none;
  }
  /* The lantern switch (src/input/lantern.js, D-080), the pause button (src/input/pause.js,
     D-187), the map button (src/input/mapbutton.js, D-205), the bag button (src/input/bagbutton.js, D-247) and the dev wrench: placed by script in the room's corners (D-381). */
  #lantern-button, #pause-button, #map-button, #bag-button {
    position: fixed; z-index: 1; top: 8px; left: 8px;
    width: 44px; height: 44px; padding: 0; display: grid; place-items: center;
    border: 1px solid #3a3446; border-radius: 4px; background: rgba(11,10,16,.85); cursor: pointer;
  }
  #lantern-button[aria-pressed="true"] { border-color: #a8642c; }
  #lantern-button canvas, #pause-button canvas, #map-button canvas, #bag-button canvas { width: 25px; height: 25px; image-rendering: pixelated; image-rendering: crisp-edges; background: none; }
  /* Dev tools (src/dev/dev.js, panel.js): on for everyone (D-086). Game palette
     (ART-DIRECTION.md): violet for the section tabs, stone for the tools
     beside them, lantern gold for what is on, the hostile red for what undoes
     (D-093). Words are in the pixel font, as masks over the text colour (D-200). */
  #dev-button, #dev-panel, #dev-readout { position: fixed; z-index: 1; color: #c9c2d6; }
  #dev-button {
    top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left));
    width: 44px; height: 44px; padding: 0; display: grid; place-items: center;
    border: 1px solid #ffc65c; border-radius: 6px; background: rgba(14,12,22,.88); cursor: pointer;
  }
  #dev-button[aria-expanded="true"] { background: #3a2a14; box-shadow: 0 0 10px rgba(255,198,92,.3); }
  #dev-button canvas { width: 24px; height: 24px; image-rendering: pixelated; image-rendering: crisp-edges; background: none; }
  /* pixel words (src/dev/pixeltext.js): one mask per piece, wrapping between pieces */
  .px { display: inline-flex; flex-direction: column; gap: 4px; vertical-align: middle; }
  .px-line { display: flex; flex-wrap: wrap; gap: 4px 8px; }
  .px-word { display: block; height: 18px; background: currentColor; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
  .px-said { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* the drawer: along the left edge, from under the wrench down to the stats
     line (height set by script); tabs in a column, the open section beside */
  #dev-panel {
    left: max(8px, env(safe-area-inset-left)); box-sizing: border-box; padding: 6px;
    display: grid; grid-template-columns: 72px auto; grid-template-rows: minmax(0, 1fr); gap: 6px;
    border: 1px solid #3a3446; border-left: 2px solid #a58ce0; border-radius: 6px; background: rgba(14,12,22,.95);
    box-shadow: 0 6px 20px rgba(0,0,0,.55);
    transition: transform .14s ease-out;
  }
  #dev-panel.shut { transform: translateX(calc(-100% - 16px)); visibility: hidden; transition: transform .14s ease-in, visibility 0s .14s; }
  @media (prefers-reduced-motion: reduce) { #dev-panel, #dev-panel.shut { transition: none; } }
  #dev-panel button { min-height: 44px; padding: 0 8px; color: inherit; border-radius: 4px; cursor: pointer; }
  #dev-panel button:active { transform: translateY(1px); }
  /* tabs: violet words stacked on the drawer's darkest ground */
  #dev-panel .dev-tabs { display: flex; flex-direction: column; gap: 4px; min-height: 0; overflow-y: auto; } /* scrolls when short, as sideways */
  #dev-panel .dev-tab { flex: none; color: #a99cc9; background: #1b1728; border: 1px solid #332b4a; text-align: left; }
  #dev-panel .dev-tab:hover { border-color: #5c4d86; }
  #dev-panel .dev-tab[aria-expanded="true"] { color: #f0eaff; background: #3a2f5c; border-color: #a58ce0; }
  /* the open section: a stone-coloured column of tools, scrolling when long */
  #dev-panel .dev-body {
    width: 148px; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 6px; padding: 6px;
    overflow-y: auto; background: #1d212b; border: 1px solid #2b303c; border-radius: 4px;
  }
  #dev-panel .dev-body[hidden] { display: none; }
  #dev-panel .dev-row { display: grid; grid-template-columns: 1fr; gap: 4px; }
  #dev-panel .dev-kind { color: #7d869c; margin-top: 2px; }
  #dev-panel .dev-body button { color: #d3d7e0; background: #2b303c; border: 1px solid #3f4656; }
  #dev-panel .dev-body button:hover { border-color: #69748b; }
  #dev-panel .dev-body button[aria-pressed="true"] { color: #ffd66b; background: #3a2e18; border-color: #f39a3b; }
  #dev-panel .dev-body .dev-undo { color: #e8a49b; }
  #dev-panel .dev-body .dev-undo:hover { border-color: #e8786a; }
  #dev-panel .dev-switch { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  #dev-panel kbd { padding: 3px 4px; color: #9aa3b5; border: 1px solid #4a5263; border-radius: 3px; background: #22262f; }
  #dev-panel [aria-pressed="true"] kbd { color: #ffd66b; border-color: #8a6a2a; background: #2a2212; }
  #dev-panel .dev-slider { display: flex; align-items: center; gap: 6px; min-height: 44px; }
  #dev-panel .dev-slider input { flex: 1; min-width: 0; height: 32px; margin: 0; accent-color: #f39a3b; }
  #dev-panel .dev-amount { color: #ffd66b; }
  #dev-panel .dev-steps { grid-template-columns: repeat(3, 1fr); }
  #dev-panel .dev-steps > :last-child { grid-column: 1 / -1; }
  #dev-panel .dev-depth { align-self: center; justify-self: center; color: #ffd66b; }
  #dev-panel textarea { box-sizing: border-box; width: 100%; font: 11px/1.2 ui-monospace, "Courier New", monospace; color: inherit; background: #0e0c16; border: 1px solid #3f4656; border-radius: 4px; -webkit-user-select: text; user-select: text; resize: none; word-break: break-all; }
  #dev-panel textarea[hidden] { display: none; }
  /* A phone held upright: the picture asking to turn it, over everything (src/input/upright.js, D-377). */
  #upright { position: fixed; inset: 0; z-index: 3; display: grid; place-items: center; background: #0b0a10; touch-action: none; }
  #upright[hidden] { display: none; }
  #upright canvas { image-rendering: pixelated; image-rendering: crisp-edges; background: none; }
  /* the stats line: top centre, between the glass panel and the buttons, clear of the text line (D-381) */
  #dev-readout {
    left: 50%; top: max(8px, env(safe-area-inset-top)); transform: translateX(-50%);
    max-width: calc(100% - 320px); padding: 4px 6px; border-radius: 4px; background: rgba(14,12,22,.7);
    color: #b7bdcc; pointer-events: none;
  }
</style>
</head>
<body>
<main><div id="stage"><canvas id="room" aria-hidden="true"></canvas><canvas id="game" aria-label="Gloamdeep game screen"></canvas><canvas id="list" aria-hidden="true"></canvas></div></main>
<div id="line" role="status"></div>
<div id="version" aria-label="Version"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
